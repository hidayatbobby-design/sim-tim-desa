
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM-TIM DESA</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#14532d;color:white;padding:20px}
main{padding:15px}
.card{background:white;padding:15px;margin:12px 0;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
button{background:#166534;color:white;border:0;font-weight:bold}
.stats{display:flex;gap:8px}
.stats div{flex:1;text-align:center;padding:12px;border-radius:8px;background:#e2e8f0}
.green{background:#bbf7d0!important}
.yellow{background:#fef08a!important}
.red{background:#fecaca!important}
small{color:#64748b}
</style>
</head>
<body>
<header>
<h2>SIM-TIM DESA</h2>
<p>Sistem Informasi Data Keluarga</p>
</header>
<main>
<div class="card">
<h3>Dashboard</h3>
<div class="stats">
<div class="green">Hijau<br><b id="h">0</b></div>
<div class="yellow">Kuning<br><b id="k">0</b></div>
<div class="red">Merah<br><b id="m">0</b></div>
</div>
<p>Total KK: <b id="total">0</b></p>
<p>Total pemilih: <b id="pemilih">0</b></p>
</div>

<div class="card">
<h3>Input Data KK</h3>
<input id="kk" placeholder="Nomor KK">
<input id="kepala" placeholder="Nama Kepala Keluarga">
<input id="rt" placeholder="RT">
<input id="rw" placeholder="RW">
<input id="jumlah" type="number" min="1" placeholder="Jumlah pemilih dalam KK">
<select id="status">
<option value="Hijau">Hijau</option>
<option value="Kuning">Kuning</option>
<option value="Merah">Merah</option>
</select>
<button onclick="simpan()">SIMPAN DATA KK</button>
</div>

<div class="card">
<h3>Daftar Data KK</h3>
<input id="cari" placeholder="Cari nama atau nomor KK" oninput="tampil()">
<div id="daftar"></div>
</div>
</main>

<script>
let data=JSON.parse(localStorage.getItem("simtim")||"[]");
function simpan(){
let kk=document.getElementById("kk").value.trim();
let kepala=document.getElementById("kepala").value.trim();
let rt=document.getElementById("rt").value.trim();
let rw=document.getElementById("rw").value.trim();
let jumlah=Number(document.getElementById("jumlah").value);
let status=document.getElementById("status").value;
if(!kk||!kepala||!rt||!rw||!Number.isInteger(jumlah)||jumlah<1){
alert("Lengkapi semua data dengan benar");return;
}
if(data.some(x=>x.kk===kk)){
alert("Nomor KK sudah terdaftar");return;
}
data.push({kk,kepala,rt,rw,jumlah,status});
localStorage.setItem("simtim",JSON.stringify(data));
["kk","kepala","rt","rw","jumlah"].forEach(id=>document.getElementById(id).value="");
tampil();
alert("Data berhasil disimpan");
}
function tampil(){
let cari=document.getElementById("cari").value.toLowerCase();
let hasil=data.filter(x=>(x.kk+" "+x.kepala).toLowerCase().includes(cari));
document.getElementById("daftar").innerHTML=hasil.map(x=>
`<div class="card ${x.status.toLowerCase()}">
<b>${aman(x.kepala)}</b><br>
KK: ${aman(x.kk)}<br>
RT ${aman(x.rt)} / RW ${aman(x.rw)}<br>
Jumlah pemilih: ${x.jumlah}<br>
Status: ${x.status}
<button onclick="hapus('${x.kk}')">Hapus</button>
</div>`).join("");
document.getElementById("total").textContent=data.length;
document.getElementById("pemilih").textContent=data.reduce((a,b)=>a+b.jumlah,0);
["Hijau","Kuning","Merah"].forEach((s,i)=>{
document.getElementById(["h","k","m"][i]).textContent=data.filter(x=>x.status===s).length;
});
}
function aman(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function hapus(kk){
if(confirm("Hapus data KK ini?")){
data=data.filter(x=>x.kk!==kk);
localStorage.setItem("simtim",JSON.stringify(data));
tampil();
}
}
tampil();
</script>
</body>
</html>
