<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM-TIM DESA</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;color:#1e293b}
header{background:#14532d;color:white;padding:20px}
main{padding:15px;max-width:950px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
button{background:#166534;color:white;border:0;font-weight:bold}
.secondary{background:#475569}.danger{background:#b91c1c}.edit{background:#2563eb}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#dcfce7;padding:14px;text-align:center;border-radius:8px}
.stat b{font-size:23px;display:block;margin-top:5px}
.voter{border:1px solid #e2e8f0;padding:10px;margin:8px 0;border-radius:8px}
.actions{display:flex;gap:8px}.actions button{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border:1px solid #e2e8f0;text-align:left}
th{background:#dcfce7}.table-wrap{overflow-x:auto}
</style>
</head>
<body>
<header><h2>SIM-TIM DESA</h2><p>Sistem Informasi Data Keluarga dan Pemilih</p></header>
<main>
<section class="card">
<h3>Dashboard</h3>
<div class="stats">
<div class="stat">Total KK<b id="total">0</b></div>
<div class="stat">Total Pemilih<b id="pemilih">0</b></div>
<div class="stat">Total RT<b id="totalRT">0</b></div>
<div class="stat">Total RW<b id="totalRW">0</b></div>
</div>
</section>
<section class="card">
<h3 id="judulForm">Input Data KK</h3>
<input id="kk" placeholder="Nomor KK">
<input id="kepala" placeholder="Nama Kepala Keluarga">
<input id="rt" placeholder="Nomor RT">
<input id="rw" placeholder="Nomor RW">
<label for="jumlah">Jumlah pemilih dalam KK</label>
<input id="jumlah" type="number" min="1" max="30" placeholder="Masukkan jumlah pemilih">
<div id="kolomAnggota"></div>
<button onclick="simpan()">SIMPAN DATA KK</button>
<button class="secondary" onclick="resetForm()">KOSONGKAN FORM</button>
</section>
<section class="card">
<h3>Daftar Data KK</h3>
<input id="cari" placeholder="Cari nama, nomor KK, RT atau RW" oninput="tampil()">
<div id="daftar"></div>
</section>
<section class="card"><h3>Rekapitulasi Per RT</h3><div id="rekapRT" class="table-wrap"></div></section>
<section class="card"><h3>Rekapitulasi Per RW</h3><div id="rekapRW" class="table-wrap"></div></section>
<section class="card">
<h3>Cadangan Data</h3>
<button onclick="ekspor()">DOWNLOAD CADANGAN DATA JSON</button>
<input type="file" id="file" accept=".json,application/json">
<button class="secondary" onclick="impor()">PULIHKAN DATA JSON</button>
<p style="font-size:12px;color:#64748b">Data tersimpan pada browser/perangkat ini. Unduh cadangan secara berkala.</p>
</section>
</main>
<script>
let data=[];
let editId=null;
try {
 data=JSON.parse(localStorage.getItem("simtim_v2")||"[]");
 if(!Array.isArray(data)) data=[];
} catch(e) { data=[]; }
data=data.map((x,i)=>({
 ...x,id:x.id||String(i),
 anggota:Array.isArray(x.anggota)?x.anggota.map(a=>typeof a==="string"?{nama:a,status:"Belum ditentukan"}:{nama:a.nama||"",status:a.status||"Belum ditentukan"}):[]
}));
const el=id=>document.getElementById(id);
function aman(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function simpanLokal(){localStorage.setItem("simtim_v2",JSON.stringify(data));}
function buatKolom(){
 const n=Math.max(0,Math.min(30,Number(el("jumlah").value)||0));
 const lama=[...document.querySelectorAll(".namaPemilih")].map(x=>x.value);
 const statusLama=[...document.querySelectorAll(".statusPemilih")].map(x=>x.value);
 el("kolomAnggota").innerHTML="";
 for(let i=0;i<n;i++){
  const status=statusLama[i]||"Belum ditentukan";
  el("kolomAnggota").insertAdjacentHTML("beforeend",
   '<div class="voter"><b>Nama Pemilih '+(i+1)+'</b>'+
   '<input class="namaPemilih" placeholder="Nama pemilih '+(i+1)+'" value="'+aman(lama[i]||"")+'">'+
   '<label>Status (opsional)</label><select class="statusPemilih">'+
   '<option value="Belum ditentukan" '+(status==="Belum ditentukan"?"selected":"")+'>Belum ditentukan</option>'+
   '<option value="Mendukung" '+(status==="Mendukung"?"selected":"")+'>Mendukung</option>'+
   '<option value="Belum pasti" '+(status==="Belum pasti"?"selected":"")+'>Belum pasti</option>'+
   '<option value="Tidak mendukung" '+(status==="Tidak mendukung"?"selected":"")+'>Tidak mendukung</option>'+
   '</select></div>');
 }
}
el("jumlah").addEventListener("input",buatKolom);
function resetForm(){
 editId=null;
 ["kk","kepala","rt","rw","jumlah"].forEach(x=>el(x).value="");
 el("kolomAnggota").innerHTML="";
 el("judulForm").textContent="Input Data KK";
}
function simpan(){
 const kk=el("kk").value.trim(),kepala=el("kepala").value.trim();
 const rt=el("rt").value.trim(),rw=el("rw").value.trim(),n=Number(el("jumlah").value);
 const names=[...document.querySelectorAll(".namaPemilih")];
 const statuses=[...document.querySelectorAll(".statusPemilih")];
 if(!kk||!kepala||!rt||!rw){alert("Lengkapi Nomor KK, Kepala Keluarga, RT dan RW.");return;}
 if(!Number.isInteger(n)||n<1||n>30||names.length!==n){alert("Jumlah pemilih harus antara 1 sampai 30.");return;}
 if(names.some(x=>!x.value.trim())){alert("Isi nama semua pemilih.");return;}
 if(data.some(x=>String(x.kk).toLowerCase()===kk.toLowerCase()&&x.id!==editId)){alert("Nomor KK sudah terdaftar.");return;}
 const item={id:editId||String(Date.now()),kk,kepala,rt,rw,
  anggota:names.map((x,i)=>({nama:x.value.trim(),status:statuses[i].value}))};
 if(editId){const i=data.findIndex(x=>x.id===editId);if(i>=0)data[i]=item;}
 else data.push(item);
 simpanLokal();resetForm();tampil();alert("Data KK berhasil disimpan.");
}
function edit(id){
 const x=data.find(x=>x.id===id);if(!x)return;
 editId=id;
 ["kk","kepala","rt","rw"].forEach(k=>el(k).value=x[k]||"");
 el("jumlah").value=x.anggota.length;
 el("judulForm").textContent="Edit Data KK";
 buatKolom();
 const names=document.querySelectorAll(".namaPemilih"),statuses=document.querySelectorAll(".statusPemilih");
 x.anggota.forEach((a,i)=>{names[i].value=a.nama;statuses[i].value=a.status||"Belum ditentukan";});
 window.scrollTo({top:0,behavior:"smooth"});
}
function hapus(id){
 if(!confirm("Yakin ingin menghapus data KK ini?"))return;
 data=data.filter(x=>x.id!==id);simpanLokal();tampil();
}
function tampil(){
 const q=el("cari").value.toLowerCase();
 el("total").textContent=data.length;
 el("pemilih").textContent=data.reduce((s,x)=>s+x.anggota.length,0);
 el("totalRT").textContent=new Set(data.map(x=>x.rt)).size;
 el("totalRW").textContent=new Set(data.map(x=>x.rw)).size;
 const hasil=data.filter(x=>(x.kk+" "+x.kepala+" "+x.rt+" "+x.rw+" "+x.anggota.map(a=>a.nama).join(" ")).toLowerCase().includes(q));
 el("daftar").innerHTML=hasil.length?hasil.map(x=>
  '<div class="voter"><b>'+aman(x.kepala)+'</b><p>KK: '+aman(x.kk)+'</p>'+
  '<p>RT: '+aman(x.rt)+' | RW: '+aman(x.rw)+'</p><p>Jumlah pemilih: '+x.anggota.length+'</p>'+
  '<details><summary>Lihat nama pemilih</summary>'+
  x.anggota.map((a,i)=>'<p>'+(i+1)+'. '+aman(a.nama)+' — '+aman(a.status)+'</p>').join("")+
  '</details><div class="actions"><button class="edit" onclick="edit('+JSON.stringify(x.id)+')">EDIT</button>'+
  '<button class="danger" onclick="hapus('+JSON.stringify(x.id)+')">HAPUS</button></div></div>'
 ).join(""):"Belum ada data ditemukan.";
 rekap("rt","rekapRT");rekap("rw","rekapRW");
}

function rekap(field,target){
 const grup={};

 data.forEach(x=>{
   const k=x[field]||"-";

   if(!grup[k]){
     grup[k]={
       kk:0,
       pemilih:0,
       mendukung:0,
       belumPasti:0,
       tidakMendukung:0,
       belumDitentukan:0
     };
   }

   grup[k].kk++;

   x.anggota.forEach(a=>{
     grup[k].pemilih++;

     const s=(a.status||"Belum ditentukan").toLowerCase();

     if(s==="mendukung"){
       grup[k].mendukung++;
     }else if(s==="belum pasti"){
       grup[k].belumPasti++;
     }else if(s==="tidak mendukung"){
       grup[k].tidakMendukung++;
     }else{
       grup[k].belumDitentukan++;
     }
   });
 });

 const keys=Object.keys(grup).sort(
   (a,b)=>a.localeCompare(b,undefined,{numeric:true})
 );

 el(target).innerHTML=keys.length?
 `<table>
 <tr>
 <th>${field.toUpperCase()}</th>
 <th>Jumlah KK</th>
 <th>Total Pemilih</th>
 <th>Mendukung</th>
 <th>Belum Pasti</th>
 <th>Tidak Mendukung</th>
 <th>Belum Ditentukan</th>
 </tr>`+
 keys.map(k=>`
 <tr>
 <td>${aman(k)}</td>
 <td>${grup[k].kk}</td>
 <td>${grup[k].pemilih}</td>
 <td>${grup[k].mendukung}</td>
 <td>${grup[k].belumPasti}</td>
 <td>${grup[k].tidakMendukung}</td>
 <td>${grup[k].belumDitentukan}</td>
 </tr>
 `).join("")+
 `</table>`:"Belum ada data.";
  }
                                               
function ekspor(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="cadangan-sim-tim-desa.json";a.click();URL.revokeObjectURL(url);
}
function impor(){
 const file=el("file").files[0];if(!file){alert("Pilih file JSON terlebih dahulu.");return;}
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const d=JSON.parse(reader.result);if(!Array.isArray(d))throw Error();
   if(!confirm("Data saat ini akan diganti dengan data cadangan. Lanjutkan?"))return;
   data=d.map((x,i)=>({...x,id:x.id||String(Date.now()+i),
    anggota:Array.isArray(x.anggota)?x.anggota.map(a=>typeof a==="string"?{nama:a,status:"Belum ditentukan"}:a):[]}));
   simpanLokal();resetForm();tampil();alert("Data berhasil dipulihkan.");
  }catch(e){alert("File JSON tidak valid.");}
 };
 reader.readAsText(file);
}
tampil();
</script>
</body>
</html>
