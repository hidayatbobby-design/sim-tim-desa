
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM-TIM DESA</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f1f5f9;margin:0;color:#1e293b}
header{background:#14532d;color:white;padding:20px}
main{padding:15px;max-width:850px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:10px}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{background:#166534;color:white;border:0;font-weight:bold}
.danger{background:#b91c1c}
.member{background:#f1f5f9;padding:10px;margin:8px 0;border-radius:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#dcfce7;padding:14px;text-align:center;border-radius:8px}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<header>
<h2>SIM-TIM DESA</h2>
<p>Sistem Informasi Data Keluarga</p>
</header>
<main>

<div class="card">
<h3>Dashboard</h3>
<div class="stats">
<div class="stat">Total KK<br><b id="total">0</b></div>
<div class="stat">Total Pemilih<br><b id="pemilih">0</b></div>
</div>
</div>

<div class="card">
<h3>Input Data KK</h3>
<input id="kk" placeholder="Nomor KK">
<input id="kepala" placeholder="Nama Kepala Keluarga">
<input id="rt" placeholder="RT">
<input id="rw" placeholder="RW">

<label>Jumlah anggota keluarga</label>
<input id="jumlah" type="number" min="1" max="30"
placeholder="Masukkan jumlah pemilih"
oninput="buatKolom()">

<div id="kolomAnggota"></div>

<button onclick="simpan()">SIMPAN DATA KK</button>
<button class="danger" onclick="resetForm()">KOSONGKAN FORM</button>
</div>

<div class="card">
<h3>Daftar Data KK</h3>
<input id="cari" placeholder="Cari nama atau nomor KK" oninput="tampil()">
<div id="daftar"></div>
</div>

</main>

<script>
let data=[];
let editId=null;

try{
data=JSON.parse(localStorage.getItem("simtim_v2")||"[]");
if(!Array.isArray(data))data=[];
}catch(e){data=[];}

data=data.map((x,i)=>({
...x,
id:x.id||String(i),
anggota:Array.isArray(x.anggota)?x.anggota:[]
}));

function simpanLokal(){
localStorage.setItem("simtim_v2",JSON.stringify(data));
}

function aman(s){
return String(s??"").replace(/[&<>"']/g,
c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function buatKolom(){

function buatKolom(){
  let jumlah=Math.max(0,Math.min(30,
    Number(document.getElementById("jumlah").value)||0
  ));

  let lama=[];
  document.querySelectorAll(".namaAnggota").forEach((e,i)=>{
    let s=document.getElementById("status"+i);
    lama[i]={
      nama:e.value,
      status:s?s.value:"Perlu Verifikasi"
    };
  });

  let html="";
  for(let i=0;i<jumlah;i++){
    let a=lama[i]||{};
    html+=`
    <div class="member">
      <b>Pemilih ${i+1}</b>
      <input class="namaAnggota"
        placeholder="Nama pemilih ${i+1}"
        value="${aman(a.nama||"")}">
      <label>Status verifikasi</label>
      <select id="status${i}">
        <option value="Perlu Verifikasi"
        ${a.status==="Perlu Verifikasi"?"selected":""}>
        Perlu Verifikasi</option>
        <option value="Terverifikasi"
        ${a.status==="Terverifikasi"?"selected":""}>
        Terverifikasi</option>
      </select>
    </div>`;
  }

  document.getElementById("kolomAnggota").innerHTML=html;
}
  
function resetForm(){
editId=null;
["kk","kepala","rt","rw","jumlah"].forEach(id=>{
document.getElementById(id).value="";
});
document.getElementById("kolomAnggota").innerHTML="";
}

function simpan(){
let kk=document.getElementById("kk").value.trim();
let kepala=document.getElementById("kepala").value.trim();
let rt=document.getElementById("rt").value.trim();
let rw=document.getElementById("rw").value.trim();
let j=Number(document.getElementById("jumlah").value);

if(!kk||!kepala||!rt||!rw){
alert("Lengkapi data KK terlebih dahulu");
return;
}
if(!j||j<1||j>30){
alert("Jumlah anggota harus 1 sampai 30");
return;
}

if(data.some(x=>x.kk===kk&&x.id!==editId)){
alert("Nomor KK sudah terdaftar");
return;
}

let anggota=[];
let nama=document.querySelectorAll(".namaAnggota");

for(let i=0;i<j;i++){
let n=nama[i].value.trim();
if(!n){
alert("Nama Pemilih "+(i+1)+" belum diisi");
nama[i].focus();
return;
}
anggota.push({
nama:n,
status:document.getElementById("status"+i).value
});
}

let item={id:editId||String(Date.now()),kk,kepala,rt,rw,anggota};

if(editId){
let idx=data.findIndex(x=>x.id===editId);
if(idx!==-1)data[idx]=item;
}else{
data.push(item);
}

simpanLokal();
resetForm();
tampil();
alert("Data KK berhasil disimpan");
}

function edit(id){
let x=data.find(a=>a.id===id);
if(!x)return;

editId=id;
document.getElementById("kk").value=x.kk;
document.getElementById("kepala").value=x.kepala;
document.getElementById("rt").value=x.rt;
document.getElementById("rw").value=x.rw;
document.getElementById("jumlah").value=x.anggota.length;
buatKolom();

x.anggota.forEach((a,i)=>{
let n=document.querySelectorAll(".namaAnggota")[i];
if(n)n.value=a.nama||"";
let s=document.getElementById("status"+i);
if(s)s.value=a.status||"Perlu Verifikasi";
});

window.scrollTo(0,0);
}

function hapus(id){
if(!confirm("Hapus data KK ini?"))return;
data=data.filter(x=>x.id!==id);
simpanLokal();
tampil();
}

function tampil(){
let c=document.getElementById("cari").value.toLowerCase();
let hasil=data.filter(x=>
(x.kk||"").toLowerCase().includes(c)||
(x.kepala||"").toLowerCase().includes(c)||
x.anggota.some(a=>(a.nama||"").toLowerCase().includes(c))
);

document.getElementById("daftar").innerHTML=hasil.map(x=>`
<div class="member">
<b>${aman(x.kepala)}</b>
<div class="small">KK: ${aman(x.kk)} | RT ${aman(x.rt)} / RW ${aman(x.rw)}</div>
<p>Jumlah anggota: ${x.anggota.length}</p>
${x.anggota.map((a,i)=>`
<div>${i+1}. ${aman(a.nama)}
<span class="small">(${aman(a.status||"Perlu Verifikasi")})</span></div>
`).join("")}
<button onclick="edit('${aman(x.id)}')">EDIT DATA</button>
<button class="danger" onclick="hapus('${aman(x.id)}')">HAPUS DATA</button>
</div>
`).join("");

let total=data.reduce((s,x)=>s+x.anggota.length,0);
document.getElementById("total").textContent=data.length;
document.getElementById("pemilih").textContent=total;
}

tampil();
</script>
</body>
</html>
